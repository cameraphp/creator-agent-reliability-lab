# CONFIGURED, NOT YET VERIFIED on hosted GitHub Actions (no remote exists in this phase).
# Disposable Postgres service, secret-free synthetic fixtures, throwaway credentials.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: lab_admin
          POSTGRES_PASSWORD: lab_admin_local_only
          POSTGRES_DB: creator_lab
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U lab_admin -d creator_lab"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      LAB_PG_HOST: 127.0.0.1
      LAB_PG_PORT: "55439"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
      - name: Hardened gates (must exit 0)
        run: npm run evaluate:hardened
      - name: Baseline must reproduce F01/F02/F03 (asserts exit 3)
        run: npm run evaluate:baseline:expect
      - run: npm run compare
      - name: Release smoke (real API + worker processes + Postgres)
        run: npm run smoke
      - name: Upload synthetic evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: .artifacts/eval/
          if-no-files-found: warn
